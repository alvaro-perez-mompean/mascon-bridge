name: Release

# Tagging v* publishes a ready to run build.
#   git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.0.1'
        required: true

permissions:
  contents: write

env:
  # Keep in step with ci.yml.
  HIDMAESTRO_VERSION: v1.7.0
  HIDMAESTRO_SHA256: A146AB8A46D2E9CE1FB2EA269FF231830607876F6F4DB7BB13CE891EF33DEECE

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The changelog falls back to the commits since the previous tag, which
          # a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') {
              throw "Tag '$tag' is not a version like v1.2.3"
          }
          "tag=$tag"          | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version"  | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Building $tag as version $version"

      - name: Download HIDMaestro
        shell: pwsh
        run: |
          $ver = $env:HIDMAESTRO_VERSION
          $url = "https://github.com/hifihedgehog/HIDMaestro/releases/download/$ver/HIDMaestro-$ver.zip"
          $zip = Join-Path $env:RUNNER_TEMP "HIDMaestro-$ver.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip

          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $env:HIDMAESTRO_SHA256) {
              throw "SHA256 mismatch for $ver.`nExpected $env:HIDMAESTRO_SHA256`nGot      $actual"
          }

          # HIDMaestro is MIT licensed, so the binary may be redistributed as long
          # as its notices travel with it. They are staged further down.
          New-Item -ItemType Directory -Force -Path lib, third-party | Out-Null
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP/hidmaestro -Force

          $dll = Get-ChildItem $env:RUNNER_TEMP/hidmaestro -Recurse -Filter 'HIDMaestro.Core.dll' |
                 Select-Object -First 1
          if (-not $dll) { throw "HIDMaestro.Core.dll not found inside the archive" }
          Copy-Item $dll.FullName lib/HIDMaestro.Core.dll -Force

          Copy-Item "$env:RUNNER_TEMP/hidmaestro/LICENSE" `
                    "third-party/HIDMaestro-LICENSE.txt" -Force
          Copy-Item "$env:RUNNER_TEMP/hidmaestro/THIRD-PARTY-NOTICES.txt" `
                    "third-party/HIDMaestro-THIRD-PARTY-NOTICES.txt" -Force

      - name: Test
        run: dotnet test mascon-bridge.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          # Self contained: the people who download this should not need to install
          # a .NET runtime first.
          #
          # Single file: everything is packed into the executable, so the unzipped
          # folder holds the program and nothing else. Moving the loose DLLs into a
          # lib\ folder is not an option for a self contained build, because the
          # host resolves coreclr, hostpolicy and friends next to the executable.
          dotnet publish MasconBridge.csproj `
              -c Release `
              -r win-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=${{ steps.version.outputs.version }} `
              -p:DebugType=none `
              -o publish

          Write-Host "Published:"
          Get-ChildItem publish -File | ForEach-Object {
              "  {0,-24} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Stage the package
        shell: pwsh
        run: |
          $stage = "mascon-bridge-${{ steps.version.outputs.tag }}-win-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item publish/* $stage -Recurse -Force
          # mascon-bridge.cmd is not shipped: it only exists to find the executable
          # under bin\ in a source tree, and here the executable is right there.
          Copy-Item README.md, README.en.md, LICENSE $stage -Force
          Copy-Item third-party $stage/third-party -Recurse -Force

          # config.json is generated on first run, so it must not ship.
          Remove-Item "$stage/config.json" -ErrorAction SilentlyContinue

          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force

          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash
          $size = "{0:N1} MB" -f ((Get-Item "$stage.zip").Length / 1MB)
          "zip=$stage.zip"   | Out-File $env:GITHUB_OUTPUT -Append
          "sha256=$hash"     | Out-File $env:GITHUB_OUTPUT -Append
          "size=$size"       | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "$stage.zip  $size  SHA256 $hash"
        id: package

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"

          # release-notes\<tag>.md holds the changelog for that version, written by
          # hand and in the same two languages as the program: Japanese, with the
          # English inside a <details> fold. Without one, the subjects of the commits
          # since the previous tag stand in, so a release is never published with an
          # empty changelog.
          $file = Join-Path 'release-notes' "$tag.md"
          if (Test-Path $file) {
              $changelog = Get-Content $file -Encoding utf8
              Write-Host "Changelog from $file"
          } else {
              $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
              $range = if ($previous) { "$previous..$tag" } else { $tag }
              $changelog = @(git log --no-merges --format='- %s' $range)
              if (-not $changelog) { $changelog = @('- ' + $tag) }
              Write-Host "No $file, using the commits in $range"
          }

          # Built as an array rather than a here-string: PowerShell wants the
          # closing "@ in column 0, which would end the YAML block scalar.
          #
          # Japanese, like the front page of the repository and like the program
          # itself. The English is in the changelog's own fold.
          $notes = @(
            '## インストール'
            ''
            '1. ダウンロードして展開します。'
            '2. **`mascon-bridge.exe`** を実行し、UAC の確認を許可します。'
            ''
            '他に必要なものはありません。.NET ランタイムも HIDMaestro も同梱しています。'
            'ドライバーはブリッジの初回起動時に自動でインストールされます。'
            ''
            '`config.json` は初回起動時に作成されます。デバイス・軸・マスコンの機種の選び方は'
            'README を参照してください。'
            ''
            '## 変更点'
            ''
            $changelog
            ''
            '## パッケージ'
            ''
            '| | |'
            '|---|---|'
            '| ファイル | `${{ steps.package.outputs.zip }}` |'
            '| サイズ | ${{ steps.package.outputs.size }} |'
            '| SHA256 | `${{ steps.package.outputs.sha256 }}` |'
            '| HIDMaestro | `${{ env.HIDMAESTRO_VERSION }}` |'
            ''
            'Windows 10 または 11 の x64 と、管理者権限が必要です。'
            ''
            'HIDMaestro は MIT ライセンスのもとで同梱しています。ライセンス表記は `third-party/` にあります。'
          ) -join "`n"

          # utf8 is BOM less in PowerShell 7, which the Japanese needs.
          Set-Content -Path notes.md -Value $notes -Encoding utf8

          gh release create "$tag" `
              "${{ steps.package.outputs.zip }}" `
              --repo "${{ github.repository }}" `
              --title "$tag" `
              --notes-file notes.md
